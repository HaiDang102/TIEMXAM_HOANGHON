<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1209"/>
      <stop offset="50%" stop-color="#0d0804"/>
      <stop offset="100%" stop-color="#050302"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2b5"/>
      <stop offset="50%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#a87a2a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>
  <circle cx="400" cy="300" r="180" fill="rgba(212, 175, 106, 0.05)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="400" cy="300" r="140" fill="none" stroke="rgba(255, 240, 200, 0.15)" stroke-width="1"/>
  
  <!-- Tattoo Pen & Needle Vector Graphic -->
  <g transform="translate(400, 300) rotate(-35)" filter="url(#glow)">
    <!-- Main Body -->
    <rect x="-25" y="-120" width="50" height="180" rx="12" fill="url(#goldGrad)"/>
    <rect x="-18" y="-100" width="36" height="60" rx="4" fill="#120c06" opacity="0.6"/>
    <!-- Ring Details -->
    <line x1="-25" y1="-40" x2="25" y2="-40" stroke="#fff" stroke-width="2" opacity="0.4"/>
    <line x1="-25" y1="-20" x2="25" y2="-20" stroke="#fff" stroke-width="2" opacity="0.4"/>
    <!-- Tip & Needle -->
    <path d="M-15,60 L15,60 L6,130 L-6,130 Z" fill="url(#goldGrad)"/>
    <line x1="0" y1="130" x2="0" y2="160" stroke="#f5e2b5" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Ink Splashes & Flow Lines -->
  <path d="M 220,180 Q 280,140 340,200 T 420,120" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 380,480 Q 460,420 540,460 T 600,380" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="280" cy="220" r="4" fill="#f5e2b5" opacity="0.8"/>
  <circle cx="540" cy="400" r="6" fill="#f5e2b5" opacity="0.8"/>
  
  <text x="400" y="520" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#f5e2b5" text-anchor="middle" letter-spacing="3">XĂM NGHỆ THUẬT CHUYÊN NGHIỆP</text>
</svg>
