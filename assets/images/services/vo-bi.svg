<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161009"/>
      <stop offset="50%" stop-color="#0b0704"/>
      <stop offset="100%" stop-color="#040201"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2b5"/>
      <stop offset="50%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#a87a2a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 240, 200, 0.2)"/>
      <stop offset="100%" stop-color="rgba(201, 151, 63, 0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Security Shield & Privacy Vector Art -->
  <g transform="translate(400, 270)" filter="url(#glow)">
    <!-- Outer Shield -->
    <path d="M 0,-130 L 110,-80 L 110,30 C 110,110 0,160 0,160 C 0,160 -110,110 -110,30 L -110,-80 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
          
    <!-- Inner Lock & Privacy Symbol -->
    <rect x="-35" y="-10" width="70" height="60" rx="10" fill="url(#goldGrad)"/>
    <path d="M -22,-10 L -22,-35 C -22,-52 22,-52 22,-35 L 22,-10" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="15" r="7" fill="#140e08"/>
    <polygon points="0,15 -4,35 4,35" fill="#140e08"/>
  </g>
  
  <!-- Spherical Orbs (Representing High-Grade Biocompatible Spheres) -->
  <circle cx="200" cy="220" r="16" fill="url(#goldGrad)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="230" cy="270" r="22" fill="url(#goldGrad)" opacity="0.95" filter="url(#glow)"/>
  <circle cx="600" cy="220" r="16" fill="url(#goldGrad)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="570" cy="270" r="22" fill="url(#goldGrad)" opacity="0.95" filter="url(#glow)"/>

  <!-- 18+ Verification Badge Graphic -->
  <g transform="translate(400, 470)">
    <rect x="-100" y="-22" width="200" height="44" rx="22" fill="rgba(212, 175, 106, 0.15)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="7" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f5e2b5" text-anchor="middle" letter-spacing="1">🔞 DÀNH CHO KHÁCH 18+</text>
  </g>
  
  <text x="400" y="540" font-family="'Inter', sans-serif" font-size="14" fill="rgba(247, 243, 234, 0.75)" text-anchor="middle">Cam Kết Bảo Mật Thông Tin · Quy Trình Vô Trùng Y Tế · Tư Vấn Kín Đáo</text>
</svg>
