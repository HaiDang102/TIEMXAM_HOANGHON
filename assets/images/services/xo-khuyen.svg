<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18120a"/>
      <stop offset="50%" stop-color="#0e0a05"/>
      <stop offset="100%" stop-color="#050302"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2b5"/>
      <stop offset="50%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#c9973f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Line Art Geometry Backdrop -->
  <circle cx="400" cy="280" r="160" fill="rgba(255, 240, 200, 0.03)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="280" r="110" fill="none" stroke="rgba(212, 175, 106, 0.2)" stroke-width="1"/>

  <!-- Piercing Jewelry Line-Art Elements -->
  <!-- 1. Hoop Ring -->
  <g filter="url(#glow)">
    <circle cx="320" cy="260" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="320" cy="215" r="10" fill="url(#goldGrad)"/>
  </g>
  
  <!-- 2. Gem Stud Ring -->
  <g filter="url(#glow)">
    <circle cx="480" cy="260" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Crystal Facets -->
    <polygon points="480,205 492,215 480,225 468,215" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- 3. Curved Barbell Ring (Rốn/Mày) -->
  <g transform="translate(400, 310)" filter="url(#glow)">
    <path d="M -40,-20 A 50,50 0 0,0 40,-20" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-40" cy="-20" r="12" fill="url(#goldGrad)"/>
    <circle cx="40" cy="-20" r="12" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Sparkles -->
  <path d="M 320,180 L 324,192 L 336,196 L 324,200 L 320,212 L 316,200 L 304,196 L 316,192 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 480,180 L 483,189 L 492,192 L 483,195 L 480,204 L 477,195 L 468,192 L 477,189 Z" fill="#ffffff" opacity="0.8"/>

  <text x="400" y="500" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#f5e2b5" text-anchor="middle" letter-spacing="3">NGHỆ THUẬT XỎ KHUYÊN CHUYÊN NGHIỆP</text>
  <text x="400" y="535" font-family="'Inter', sans-serif" font-size="14" fill="rgba(247, 243, 234, 0.7)" text-anchor="middle">Kim Vô Trùng 1 Lần · Trang Sức Titanium / Bioplast An Toàn</text>
</svg>
