<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="50%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e5bd"/>
      <stop offset="50%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#a87a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="260" r="180" fill="url(#glow)"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer ornate frame -->
    <circle cx="300" cy="260" r="170" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="300" cy="260" r="160" stroke-width="2"/>
    
    <!-- Stylized Artist Silhouette -->
    <!-- Head & Shoulders -->
    <path d="M 230 420 C 230 350, 260 320, 300 320 C 340 320, 370 350, 370 420 Z" fill="url(#gold)" opacity="0.15" stroke-width="2"/>
    <circle cx="300" cy="240" r="55" fill="url(#gold)" opacity="0.2" stroke-width="2"/>
    
    <!-- Tattoo Machine & Hands Iconography -->
    <g transform="translate(300, 260) scale(1.4)">
      <!-- Tattoo Gun Silhouette -->
      <path d="M-15 -30 L-5 -30 L-5 -10 L15 10 L5 20 L-15 0 Z" stroke-width="2"/>
      <path d="M-5 -10 L25 -10 L30 -5 L-5 25" stroke-width="1.5"/>
      <line x1="25" y1="-10" x2="25" y2="40" stroke-width="2.5"/>
      <circle cx="-10" cy="-20" r="8" stroke-width="1.5"/>
      <circle cx="0" cy="-20" r="8" stroke-width="1.5"/>
    </g>
    
    <!-- Decorative Stars/Sparks -->
    <path d="M 180 180 Q 180 200 160 200 Q 180 200 180 220 Q 180 200 200 200 Q 180 200 180 180 Z" fill="url(#gold)" stroke="none"/>
    <path d="M 420 160 Q 420 175 405 175 Q 420 175 420 190 Q 420 175 435 175 Q 420 175 420 160 Z" fill="url(#gold)" stroke="none"/>
  </g>
  <text x="300" y="490" fill="url(#gold)" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="3" text-anchor="middle">HOÀNG HÔN</text>
  <text x="300" y="525" fill="rgba(247,243,234,0.7)" font-family="'Inter', sans-serif" font-size="14" letter-spacing="4" text-anchor="middle">MASTER TATTOO ARTIST</text>
</svg>
