    <path d="M 270 220 Q 310 200 290 160 Q 250 180 270 220 Z" fill="url(#g)" fill-opacity="0.1"/>
    <!-- Serpent coiling -->
    <path d="M 70 360 C 120 400, 280 400, 330 340 C 380 270, 310 120, 200 100 C 100 80, 70 180, 130 210 C 190 230, 270 180, 250 130" stroke-width="4"/>
