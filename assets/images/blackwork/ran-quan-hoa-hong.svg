    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e2b8"/><stop offset="100%" stop-color="#c9973f"/></linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.3"/>
  <g fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(50, 40)">
    <!-- Rose Center -->
    <circle cx="200" cy="260" r="35" stroke-width="2"/>
    <path d="M 180 250 C 190 230, 210 230, 220 250 C 230 270, 170 270, 180 250 Z" stroke-width="2"/>
