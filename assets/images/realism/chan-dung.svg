<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#14100c"/><stop offset="100%" stop-color="#080604"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e2b8"/><stop offset="100%" stop-color="#c9973f"/></linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.2"/>
  <g fill="none" stroke="url(#g)" stroke-linecap="round" opacity="0.9">
    <!-- Realism Portrait Face outline -->
    <path d="M 180 150 Q 250 110 320 150 C 350 200, 350 300, 250 380 C 150 300, 150 200, 180 150 Z" stroke-width="2"/>
    <!-- Eyes -->
    <ellipse cx="205" cy="220" rx="25" ry="12" stroke-width="2"/>
    <circle cx="205" cy="220" r="7" fill="url(#g)"/>
    <ellipse cx="295" cy="220" rx="25" ry="12" stroke-width="2"/>
    <circle cx="295" cy="220" r="7" fill="url(#g)"/>
    <!-- Nose -->
    <path d="M 250 210 L 245 270 Q 250 275 255 270" stroke-width="2"/>
    <!-- Lips -->
    <path d="M 220 310 Q 250 300 280 310 Q 250 330 220 310 Z" fill="url(#g)" fill-opacity="0.2" stroke-width="1.5"/>
    <!-- Shading Lines / Realism Hatching -->
    <path d="M 170 250 Q 185 280 200 300 M 330 250 Q 315 280 300 300" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="250" y="455" fill="#e6c887" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="2" text-anchor="middle">REALISM PORTRAIT</text>
</svg>
