<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#14100c"/><stop offset="100%" stop-color="#080604"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e2b8"/><stop offset="100%" stop-color="#c9973f"/></linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#bg)"/>
  <g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round" transform="translate(250, 230)">
    <circle cx="0" cy="0" r="160" stroke-width="1" stroke-dasharray="2 6"/>
    <circle cx="0" cy="0" r="120" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="80" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="40" stroke-width="2"/>
    
    <!-- 8 Petals mandala -->
    <path d="M 0 -160 C 30 -120 30 -40 0 0 C -30 -40 -30 -120 0 -160 Z" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 0 160 C 30 120 30 40 0 0 C -30 40 -30 120 0 160 Z" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M -160 0 C -120 30 -40 30 0 0 C -40 -30 -120 -30 -160 0 Z" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 160 0 C 120 30 40 30 0 0 C 40 -30 120 -30 160 0 Z" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Center Dotwork -->
    <circle cx="0" cy="0" r="10" fill="url(#g)"/>
  </g>
  <text x="250" y="455" fill="#e6c887" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="2" text-anchor="middle">DOTWORK MANDALA</text>
</svg>
